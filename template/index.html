<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiches Stella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: salle obscure, mur d'affiches en grille, bandeau marquee en tête */
:root{
  --bg:#f3f1ee; --surface:#ffffff; --fg:#1b1a1f; --muted:#6c6874; --line:#dcd8de;
  --accent:#c2142e; --accent-fg:#ffffff; --gold:#a8771a; --placeholder:#e7e3ea;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121116; --surface:#1c1b22; --fg:#efedf2; --muted:#9a96a3; --line:#2e2c36;
  --accent:#ff4d5e; --accent-fg:#16060a; --gold:#e3b456; --placeholder:#26242d; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1400px;margin:0 auto;padding-inline:max(16px,4vw)}
header.marquee{background:var(--fg);color:var(--bg);padding-block:28px 22px}
.marquee h1{font:400 clamp(44px,8vw,96px)/.9 var(--display);letter-spacing:.02em;margin:0}
.marquee h1 span{color:var(--accent)}
.marquee p{margin:8px 0 0;color:color-mix(in srgb,var(--bg) 70%,var(--fg));font-size:14px}
.bulbs{height:10px;margin-top:18px;background:radial-gradient(circle at 5px 5px,var(--gold) 3px,transparent 3.5px) 0 0/18px 10px repeat-x;opacity:.85}
.toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:12px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font:12px var(--mono);color:var(--muted);margin-left:auto}
.status.err{color:var(--accent)}
main .wrap{padding-block:24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 20px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;background:var(--placeholder);border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(0,0,0,.45)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .poster img{transform:scale(1.03)}
.poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font:12px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.poster .ph.loading{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.poster .ph.loading{animation:none}.poster img{transition:none}}
.card h2{font:600 15px/1.25 var(--body);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:3px;border:1px solid var(--line);color:var(--fg);font-variant-numeric:tabular-nums}
.chip b{color:var(--accent);font-weight:600}
.chip.store{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
.rating{font:600 12px var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.rating small{color:var(--muted);font-weight:400}
.links{font-size:12px}
.links a{color:var(--muted)}
</style>
</head>
<body>
<header class="marquee"><div class="wrap">
  <h1>Affiches <span>Stella</span></h1>
  <p id="sub">Les affiches disponibles au cinéma, mises à jour chaque nuit depuis le tableau.</p>
  <div class="bulbs" aria-hidden="true"></div>
</div></header>

<div class="toolbar"><div class="wrap">
  <input type="search" id="q" placeholder="Chercher un film ou un réalisateur…" aria-label="Chercher">
  <select id="store" aria-label="Stockage"><option value="">Tout stockage</option></select>
  <select id="sort" aria-label="Trier">
    <option value="pop" selected>Les plus populaires</option>
    <option value="note">Les mieux notés</option>
    <option value="sheet">Ordre du tableau</option>
    <option value="az">Titre A → Z</option>
    <option value="year">Plus récents d'abord</option>
    <option value="count">Plus d'affiches d'abord</option>
  </select>
  <span class="status" id="status" role="status"></span>
</div></div>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>

<script>
(function(){
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const films = (DATA && DATA.films) || [];
function normalize(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const SRC = {fr:"affiche FR", vo:"affiche VO", manuel:"affiche choisie"};

function card(f){
  const chips=[];
  if(f.small) chips.push(`<span class="chip">Petite <b>${esc(f.small)}</b></span>`);
  if(f.big) chips.push(`<span class="chip">Grande <b>${esc(f.big)}</b></span>`);
  if(f.other) chips.push(`<span class="chip">${esc(f.other)}</span>`);
  if(f.store) chips.push(`<span class="chip store" title="Stockage">${esc(f.store)}</span>`);
  const allo="https://www.allocine.fr/rechercher/?q="+encodeURIComponent(f.title.replace(/\(.*?\)/g,"").trim());
  const rating = f.votes>=5 ? `<span class="rating">★ ${f.note.toFixed(1).replace(".",",")} <small>/10 · ${f.votes} votes</small></span>` : "";
  const src = f.src ? ` · ${f.tmdb?`<a href="https://www.themoviedb.org/movie/${f.tmdb}" target="_blank" rel="noopener">${SRC[f.src]}</a>`:SRC[f.src]}` : "";
  return `<article class="card">
    <div class="poster">${f.img?`<img src="${esc(f.img)}" alt="Affiche de ${esc(f.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}
      <div class="ph">${f.img?"":"Pas d'affiche trouvée"}</div></div>
    <h2>${esc(f.title)}</h2>${rating}
    ${f.real?`<p class="meta">${esc(f.real)}</p>`:""}
    <div class="chips">${chips.join("")}</div>
    <div class="links"><a href="${allo}" target="_blank" rel="noopener">Allociné</a>${src}</div>
  </article>`;
}

function render(){
  const q=normalize($("#q").value), st=$("#store").value, so=$("#sort").value;
  let list=films.filter(f=>(!q || normalize(f.title+" "+f.real).includes(q)) && (!st || f.store===st));
  if(so==="az") list.sort((a,b)=>a.title.localeCompare(b.title,"fr"));
  else if(so==="year") list.sort((a,b)=>(b.year||0)-(a.year||0));
  else if(so==="count") list.sort((a,b)=>b.total-a.total);
  else if(so==="pop") list.sort((a,b)=>(b.pop||-1)-(a.pop||-1));
  else if(so==="note") list.sort((a,b)=>((b.votes>=20?b.note:-1)-(a.votes>=20?a.note:-1)) || b.votes-a.votes);
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">Aucun film ne correspond.</p>`;
}

const stores=[...new Set(films.map(f=>f.store).filter(Boolean))].sort();
$("#store").innerHTML=`<option value="">Tout stockage</option>`+stores.map(s=>`<option>${esc(s)}</option>`).join("");
if(DATA){
  const d=new Date(DATA.updated).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  $("#status").textContent=`${films.length} films · mis à jour le ${d}`;
} else $("#status").textContent="Aucune donnée : la page n'a pas encore été générée.";
$("#q").addEventListener("input",render);
$("#store").addEventListener("change",render);
$("#sort").addEventListener("change",render);
render();
})();
</script>
</body>
</html>
