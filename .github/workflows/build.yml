name: Générer la page des affiches

on:
  schedule:
    - cron: "0 4 * * *"      # chaque nuit vers 5h (heure de Paris)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lire le tableau et chercher les affiches
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/build.mjs

      - name: Garder les affiches trouvées (évite de tout rechercher chaque nuit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posters.json data/first-seen.json
          git diff --cached --quiet || git commit -m "Mise à jour des affiches [skip ci]"
          git push || echo "Rien à pousser"

      - name: Prévenir des nouveaux films (un ticket GitHub = un e-mail)
        if: hashFiles('data/new-films.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/new-films.txt ]; then
            n=$(wc -l < data/new-films.txt)
            { echo "Nouveaux films dans le tableau :"; echo; sed 's/^/- /' data/new-films.txt; echo; echo "Voir la page : https://coucano.github.io/Affiche-Stella/"; } > body.md
            gh issue create --title "$n nouveau(x) film(s) – $(date +%d/%m)" --body-file body.md
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
